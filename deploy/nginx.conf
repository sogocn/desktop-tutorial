# 家庭任务日历 —— 生产部署用 Nginx 配置（阿里云 ECS / 任意 Linux 服务器）
#
# 用法：
#   1) 构建：        npm run build        # 产出 dist/
#   2) 传上去：      rsync -avz dist/ 用户@服务器:/var/www/familyquest/dist
#   3) 放配置：      本文件存为 /etc/nginx/conf.d/familyquest.conf
#   4) 改 root：     把下面的 root 改成你实际部署路径
#   5) 生效：        sudo nginx -t && sudo systemctl reload nginx
#
# 本机（Windows）想用 nginx 自测：把 root 改成绝对路径，例如
#   root C:/Users/你的用户名/.../小程序/dist;   （注意用正斜杠）
#
# 说明：本应用是纯静态 SPA + 浏览器内 PGlite，无需任何后端、无需 PHP/Node 运行时。

server {
    listen 80;
    server_name _;   # 上云后改成你的域名，如 tq.family.cn

    # 部署目录（改成你服务器上的真实路径）
    root /var/www/familyquest/dist;
    index index.html;

    # gzip：wasm 本身已是压缩包，不再压；js/css/json/svg 收益大
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # PGlite 的 .wasm / .data 必须正确 MIME，否则浏览器拒绝实例化
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.data$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, immutable";
    }

    # 带 hash 的产物：长缓存（文件名带 hash，内容变则 hash 变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA 入口资源
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 自托管后端 API（Node 代理，连本机 Postgres）。不上 HTTPS 时明文传输，
    # 仅建议家庭内网/自家机器使用。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 登录密钥类请求可能稍慢（RLS/迁移），放宽超时
        proxy_read_timeout 30s;
    }

    # SPA：深链接刷新回 index.html（react-router 用 hash 路由则此项可不加，但加上无害）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
